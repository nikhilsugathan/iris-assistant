name: IRIS CI Smoke

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
      IRIS_DISABLE_VOICE_IO: "true"
      STT_LANGUAGE: "auto"
      IRIS_STICKY_LANGUAGE_TTS: "true"
      IRIS_MULTILINGUAL_TTS: "true"
      IRIS_LOCK_TTS_VOICE: "false"
      IRIS_MALAYALAM_NATIVE_TTS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile + import smoke
        shell: powershell
        run: |
          python -m compileall -q .
          python -c "import config; import core.brain; import core.executor; import main; print('IMPORTS_OK')"
          python -c "from core.voice import Voice; v=Voice(text_mode=True); assert v.io_disabled, 'Voice IO must be disabled in CI'; print('VOICE_IO_DISABLED_OK')"

      - name: Runtime patch regressions
        shell: powershell
        run: python -m pytest tests/test_runtime_patches.py -q

      - name: Sticky language voice regressions
        shell: powershell
        run: python -m pytest tests/test_language_voice_state.py -q

      - name: Sticky language ownership regressions
        shell: powershell
        run: python -m pytest tests/test_language_state_ownership.py -q

      - name: Language detection collision regressions
        shell: powershell
        run: python -m pytest tests/test_language_detection_collisions.py -q

      - name: Memory durability regressions
        shell: powershell
        run: python -m pytest tests/test_memory_hardening.py -q

      - name: Executor boundary regressions
        shell: powershell
        run: python -m pytest tests/test_executor_hardening.py -q

      - name: Action plan security regressions
        shell: powershell
        run: python -m pytest tests/test_action_plan_hardening.py -q

      - name: Command verification regressions
        shell: powershell
        run: python -m pytest tests/test_executor_verification.py -q

      - name: Concurrency regressions
        shell: powershell
        run: python -m pytest tests/test_concurrency_smoke.py -q

      - name: Vision architecture regressions
        shell: powershell
        run: python -m pytest tests/test_hyperscale_sweep.py::TestVisionAntiHallucination -q

      - name: STT architecture regressions
        shell: powershell
        run: python -m pytest tests/test_hyperscale_sweep.py::TestGroqSTTOffload -q

      - name: Unicode and memory architecture regressions
        shell: powershell
        run: python -m pytest tests/test_hyperscale_sweep.py::TestUTF8Enforcement -q

      - name: Runtime config architecture regressions
        shell: powershell
        run: python -m pytest tests/test_hyperscale_sweep.py::TestRuntimeConfig -q

      - name: Run lightweight smoke scripts
        shell: powershell
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/smoke_terminal_entry.py
          python tools/smoke_single_session.py
