name: Patch Main Multilingual Voice Cues

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-main-voice-cues.yml
      - main.py
  push:
    branches:
      - fix/runtime-security-voice-stability
    paths:
      - .github/workflows/patch-main-voice-cues.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact head branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-security-voice-stability
          fetch-depth: 0

      - name: Apply exact voice cue patch when needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")
          if "def _is_recognized_multilingual_cue" in text:
              print("main.py already contains multilingual cue gate")
              raise SystemExit(0)

          interrupt_anchor = '''def _is_interrupt_phrase(text: str) -> bool:\n    normalized = _normalize_command_text(text)\n    return normalized in {"stop", "wait", "hold on", "hold", "quiet"}\n'''
          interrupt_replacement = interrupt_anchor + '''\ndef _is_recognized_multilingual_cue(text: str) -> bool:\n    try:\n        from core.multilingual_patches import detect_language_style\n\n        return detect_language_style(text or "") is not None\n    except Exception:\n        return False\n'''

          single_word_old = '''        # token, it's almost certainly noise — require at least 9 chars as a\n        # very conservative pass-through for unusual but genuine single-word inputs.\n        return len(token) >= 9\n'''
          single_word_new = '''        # Recognized multilingual cues are real conversational inputs even when\n        # they are short (for example: dime, hola, merci, danke, ciao, namaste).\n        # Unknown single words still use the conservative noise threshold.\n        if _is_recognized_multilingual_cue(candidate):\n            return True\n        return len(token) >= 9\n'''

          barge_old = '''                if len(_barge_words) < 2 and _barge_normalized not in {"iris", "aletheia"}:\n'''
          barge_new = '''                if (\n                    len(_barge_words) < 2\n                    and _barge_normalized not in {"iris", "aletheia"}\n                    and not _is_recognized_multilingual_cue(_barge_normalized)\n                ):\n'''

          replacements = (
              (interrupt_anchor, interrupt_replacement, "multilingual helper anchor"),
              (single_word_old, single_word_new, "single-word substantive gate"),
              (barge_old, barge_new, "single-word barge gate"),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old snippet, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched main
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "main.py" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          python -m compileall -q main.py
          python - <<'PY'
          import main
          from core.self_model import SelfModel

          model = SelfModel()
          for cue in ("dime", "hola", "merci", "danke", "ciao", "namaste"):
              assert main._is_recognized_multilingual_cue(cue), cue
              assert main._is_substantive_voice_input(cue, model), cue
          for noise in ("urn", "rifle", "aloft"):
              assert not main._is_recognized_multilingual_cue(noise), noise
              assert not main._is_substantive_voice_input(noise, model), noise
          print("MAIN_VOICE_CUE_PATCH_OK")
          PY
          git diff -- main.py

      - name: Commit surgical main patch when changed
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already patched; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Allow recognized multilingual single-word voice cues"
          git push origin HEAD:fix/runtime-security-voice-stability
